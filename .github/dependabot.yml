version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait 7 days after a release before proposing it, the age pnpm's minimumReleaseAge will
    # require (see docs/KNOWN-ISSUES.md).
    cooldown:
      default-days: 7
    ignore:
      # typescript-eslint caps its TypeScript peer range below 6.1.0, so minors break it as well
      # as majors. Revisit when typescript-eslint supports TypeScript 7 (docs/KNOWN-ISSUES.md).
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # @types/node majors follow Node majors. Node is pinned to 24 (.nvmrc, package.json engines,
      # the dev container image), so stay on @types/node 24.x. Minors stay on: they add types for
      # APIs added in later Node 24 releases. Bump both together (docs/KNOWN-ISSUES.md).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
