name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every runner is pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19 (actions/runner-images#14748).
# Every job must fail if it examined nothing; the scripts it calls enforce that.

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          . scripts/tool-versions.env
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256_LINUX_X64}  gitleaks.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          rm gitleaks.tar.gz
      - name: Scan history reachable from this commit
        # Explicit shell: the default is `bash -e` without pipefail, which would hide gitleaks' exit code behind tee.
        shell: bash
        run: |
          # --log-opts HEAD limits the scan to history reachable from the commit under test, so a secret
          # on an unrelated branch cannot turn this run red. gitleaks only counts commits with changed text lines.
          set +e
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git --log-opts="HEAD" --redact --verbose --no-banner --no-color . 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          status=${PIPESTATUS[0]}
          set -e
          scanned=$(sed -n 's/.* \([0-9][0-9]*\) commits scanned.*/\1/p' "$RUNNER_TEMP/gitleaks.log" | tail -n 1)
          expected=$(git log --no-merges --format='@@@%H' --numstat HEAD | awk '/^@@@/{if(c&&h)n++; c=1;h=0; next} NF>=3 && $1!="-" && ($1+$2)>0 {h=1} END{if(c&&h)n++; print n+0}')
          echo "gitleaks scanned ${scanned:-?} commits; ${expected} commits reachable from HEAD change text"
          if [ "$status" -ne 0 ]; then
            while read -r rule; do
              echo "::error::gitleaks finding: rule ${rule}"
            done < <(sed -n 's/^RuleID: *//p' "$RUNNER_TEMP/gitleaks.log" | sort -u)
            echo "::error::gitleaks exited with status ${status}"
            exit 1
          fi
          if [ -z "$scanned" ] || [ "$scanned" -lt 1 ]; then
            echo "::error::gitleaks scanned no commits"
            exit 1
          fi
          if [ "$scanned" -ne "$expected" ]; then
            echo "::error::gitleaks scanned $scanned commits but $expected are reachable from HEAD"
            exit 1
          fi

  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned, checksum verified)
        run: |
          . scripts/tool-versions.env
          curl -sSfL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256_LINUX_AMD64}  actionlint.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/actionlint-bin"
          tar -xzf actionlint.tar.gz -C "$RUNNER_TEMP/actionlint-bin" actionlint
          rm actionlint.tar.gz
      - name: Lint workflow files
        run: |
          mapfile -t files < <(git ls-files '.github/workflows/*.yml' '.github/workflows/*.yaml')
          echo "actionlint: ${#files[@]} workflow file(s)"
          if [ "${#files[@]}" -lt 1 ]; then
            echo "::error::no workflow files found to lint"
            exit 1
          fi
          "$RUNNER_TEMP/actionlint-bin/actionlint" -verbose "${files[@]}"

  prettier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Prettier check (every tracked file Prettier supports)
        run: pnpm format:check

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: ESLint and pre-commit hook check
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: vue-tsc
        run: pnpm typecheck

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Vitest with coverage over all of src
        run: pnpm test:ci

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build
        run: |
          pnpm build
          js_files=$(find dist -name '*.js' | wc -l)
          echo "build: ${js_files} JavaScript files in dist"
          if [ ! -s dist/index.html ] || [ "$js_files" -lt 1 ]; then
            echo "::error::build produced no index.html or no JavaScript"
            exit 1
          fi
      - name: Every built URL is under the base path
        run: pnpm check:base
      # Only main publishes; the deploy job below picks this artifact up after every check passes.
      - name: Upload the site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # actions/upload-pages-artifact v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

  perf-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build and check startup bundle size
        run: |
          pnpm build
          pnpm perf

  audit-prod:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: pnpm audit --prod (blocking)
        run: pnpm audit:prod

  audit-all:
    # Non-blocking on purpose: dev-tool advisories should be visible but must not stop work on a
    # dependency that never ships. Production advisories are blocked by audit-prod.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: pnpm audit (all dependencies, non-blocking)
        run: pnpm audit

  # Publishes the site built by the build job. The only job with write access, and only to Pages.
  deploy:
    needs:
      - gitleaks
      - actionlint
      - prettier
      - lint
      - typecheck
      - test
      - build
      - perf-budget
      - audit-prod
      - audit-all
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time; a deploy that has started is allowed to finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        # actions/deploy-pages v5.0.1
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
